name: Apply gateway provider limit validation

on:
  push:
    branches:
      - automation/gateway-provider-limit-validation
    paths:
      - .github/workflows/apply-gateway-provider-limit-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply focused validation and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("futureagi/agentcc/serializers/contracts.py")
          old = '''class GatewayProviderUpdateRequestSerializer(serializers.Serializer):
              name = serializers.CharField()
              config = serializers.DictField(child=JsonValueField())
          '''
          new = '''class GatewayProviderUpdateRequestSerializer(serializers.Serializer):
              name = serializers.CharField()
              config = serializers.DictField(child=JsonValueField())

              _POSITIVE_LIMIT_FIELDS = (
                  "default_timeout",
                  "default_timeout_seconds",
                  "max_concurrent",
                  "conn_pool_size",
              )

              def validate_config(self, value):
                  """Validate known limits without rejecting provider-specific options."""
                  config = dict(value)
                  limit = serializers.IntegerField(min_value=1)
                  errors = {}
                  for field_name in self._POSITIVE_LIMIT_FIELDS:
                      if field_name not in config:
                          continue
                      try:
                          config[field_name] = limit.run_validation(config[field_name])
                      except serializers.ValidationError as exc:
                          errors[field_name] = exc.detail
                  if errors:
                      raise serializers.ValidationError(errors)
                  return config
          '''
          text = path.read_text()
          if old not in text:
              raise SystemExit("GatewayProviderUpdateRequestSerializer anchor not found")
          path.write_text(text.replace(old, new, 1))

          test_path = Path(
              "futureagi/agentcc/tests/test_gateway_provider_update_limits.py"
          )
          test_path.write_text('''from unittest.mock import patch

          import pytest
          from rest_framework import status

          from agentcc.models import AgentccProviderCredential
          from integrations.services.credentials import CredentialManager


          @pytest.mark.integration
          @pytest.mark.api
          class TestGatewayProviderUpdateLimits:
              @patch("agentcc.views.gateway.push_org_config", return_value=True)
              def test_rejects_non_positive_limits_before_write_or_push(
                  self,
                  mock_push_config,
                  auth_client,
                  organization,
              ):
                  credential = AgentccProviderCredential.no_workspace_objects.create(
                      organization=organization,
                      provider_name="provider-limit-validation",
                      display_name="Provider Limit Validation",
                      encrypted_credentials=CredentialManager.encrypt(
                          {"api_key": "sk-provider-limit-validation"}
                      ),
                      api_format="openai",
                      default_timeout_seconds=60,
                      max_concurrent=100,
                      conn_pool_size=100,
                  )
                  encrypted_before = bytes(credential.encrypted_credentials)

                  for field_name, value in (
                      ("default_timeout", 0),
                      ("default_timeout_seconds", -1),
                      ("max_concurrent", 0),
                      ("conn_pool_size", -1),
                  ):
                      response = auth_client.post(
                          "/agentcc/gateways/default/update-provider/",
                          {
                              "name": credential.provider_name,
                              "config": {field_name: value},
                          },
                          format="json",
                      )
                      assert response.status_code == status.HTTP_400_BAD_REQUEST

                  mock_push_config.assert_not_called()
                  credential.refresh_from_db()
                  assert credential.default_timeout_seconds == 60
                  assert credential.max_concurrent == 100
                  assert credential.conn_pool_size == 100
                  assert bytes(credential.encrypted_credentials) == encrypted_before
          ''')
          PY

      - name: Validate focused contract
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            futureagi/agentcc/serializers/contracts.py \
            futureagi/agentcc/tests/test_gateway_provider_update_limits.py
          git diff --check
          python -m pip install -q "django==5.1.8" djangorestframework
          PYTHONPATH=futureagi python - <<'PY'
          from django.conf import settings

          if not settings.configured:
              settings.configure(USE_I18N=False, SECRET_KEY="test")

          from agentcc.serializers.contracts import (
              GatewayProviderUpdateRequestSerializer,
          )

          for field_name, value in (
              ("default_timeout", 0),
              ("default_timeout_seconds", -1),
              ("max_concurrent", 0),
              ("conn_pool_size", -1),
          ):
              serializer = GatewayProviderUpdateRequestSerializer(
                  data={"name": "openai", "config": {field_name: value}}
              )
              assert not serializer.is_valid(), field_name
              assert field_name in serializer.errors["config"]

          serializer = GatewayProviderUpdateRequestSerializer(
              data={
                  "name": "custom",
                  "config": {
                      "default_timeout": "17",
                      "max_concurrent": "3",
                      "conn_pool_size": 5,
                      "adapter_option": {"kept": True},
                  },
              }
          )
          assert serializer.is_valid(), serializer.errors
          config = serializer.validated_data["config"]
          assert config["default_timeout"] == 17
          assert config["max_concurrent"] == 3
          assert config["conn_pool_size"] == 5
          assert config["adapter_option"] == {"kept": True}
          print("GATEWAY_PROVIDER_LIMIT_CONTRACT_OK")
          PY

      - name: Publish clean follow-up branch
        shell: bash
        run: |
          set -euo pipefail
          base=f0e64a7aab4bf84b4311edda2612b318c510ffc4
          test "$(git rev-parse HEAD^)" = "$base"
          rm .github/workflows/apply-gateway-provider-limit-validation.yml
          git reset --mixed "$base"
          git diff --check
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git add \
            futureagi/agentcc/serializers/contracts.py \
            futureagi/agentcc/tests/test_gateway_provider_update_limits.py
          git commit --signoff -m \
            "fix(agentcc): validate provider limits on gateway update"
          git push --force origin \
            HEAD:fix/gateway-provider-update-limit-validation
